<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <script src="users.js" defer></script>
  </head>
  <body>
    <header>
      <h1>User Directory</h1>
      <p>Load users from an API and filter them.</p>
    </header>

    <main>
      <section>
        <h2>Users</h2>
        <button id="load-users" type="button">Load users</button>

        <p>
          <label for="filter-input">Filter by name</label>
          <input type="text" id="filter-input" placeholder="Type a name...">
        </p>

        <p id="status" role="status"></p>
        <ul id="users-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
